<button
  class="theme-toggle"
  type="button"
  role="switch"
  aria-label="Modalità chiara"
  [attr.aria-checked]="themeService.theme() === 'light'"
  [attr.title]="themeService.theme() === 'dark' ? 'Passa al tema chiaro' : 'Passa al tema scuro'"
  (click)="themeService.toggle()"
>
  <svg class="theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <circle cx="12" cy="12" r="4" />
    <path
      d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"
    />
  </svg>
  <svg class="theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z" />
  </svg>
</button>
