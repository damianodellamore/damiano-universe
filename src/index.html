<!doctype html>
<html lang="it" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Damiano Dell'Amore — Full Stack Developer & Digital Creator</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Damiano Dell'Amore: sviluppatore e creator di TreasureLoop e RebusLucca. Scopri le mie app e le mie identità creative, DaMMaD e MyNameMe (mynameme.com)."
    />
    <meta name="theme-color" content="#05070d" />
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem('damiano-universe-theme');
        } catch {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'light' ? '#f5f3ee' : '#05070d';
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="logos/damianodellamore_logo.svg" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
